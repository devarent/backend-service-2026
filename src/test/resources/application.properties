# ---------------------------------------------------------------------------
# Test-only configuration.
# This file shadows src/main/resources/application.properties on the test
# classpath, so it must be self-contained. No Docker, no Redis, no secrets.
# ---------------------------------------------------------------------------
quarkus.application.name=order-service
# Use an ephemeral port so tests never collide with a service already bound
# to 8081 on a developer machine. RestAssured follows the actual port.
quarkus.http.test-port=0

# H2 in PostgreSQL compatibility mode; Hibernate owns the schema.
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:orders;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
quarkus.datasource.jdbc.max-size=10

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.jdbc.timezone=UTC

# Flyway is validated against PostgreSQL in CI, not during H2 tests.
quarkus.flyway.migrate-at-start=false

quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.fail-on-unknown-properties=true
quarkus.jackson.serialization-inclusion=non-null

quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.export.prometheus.path=/q/metrics

# Redis client is present but disabled; RevenueCache falls back to a local map,
# and the business config below disables caching entirely for deterministic tests.
quarkus.redis.hosts=redis://localhost:6379
quarkus.redis.devservices.enabled=false
quarkus.redis.health.enabled=false

app.pricing.tax-rate=0.0825
app.orders.currency=USD
app.orders.max-items-per-order=100
app.cache.enabled=false
app.cache.redis-enabled=false
app.cache.ttl=30s
