# ---------------------------------------------------------------------------
# Application
# ---------------------------------------------------------------------------
quarkus.application.name=order-service
quarkus.application.version=1.0.0
quarkus.http.port=8080
quarkus.http.test-port=8081

# ---------------------------------------------------------------------------
# Persistence (PostgreSQL by default)
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:orders}
quarkus.datasource.password=${DB_PASSWORD:orders}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/orders}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.acquisition-timeout=10s

quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.jdbc.timezone=UTC

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.baseline-on-migrate=false

# ---------------------------------------------------------------------------
# HTTP / JSON
# ---------------------------------------------------------------------------
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.fail-on-unknown-properties=true
quarkus.jackson.serialization-inclusion=non-null

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true

# ---------------------------------------------------------------------------
# OpenAPI
# ---------------------------------------------------------------------------
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.info-title=Order Management API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Order lifecycle, cancellation, and revenue reporting for a single-currency storefront.
quarkus.smallrye-openapi.info-contact-name=Backend Platform Team
quarkus.smallrye-openapi.info-license-name=MIT

# ---------------------------------------------------------------------------
# Business configuration
# ---------------------------------------------------------------------------
app.pricing.tax-rate=0.0825
app.orders.currency=USD
app.orders.max-items-per-order=100

# ---------------------------------------------------------------------------
# Cache (Redis with graceful in-memory fallback)
# ---------------------------------------------------------------------------
quarkus.redis.hosts=redis://localhost:6379
app.cache.enabled=true
app.cache.redis-enabled=true
app.cache.ttl=30s

# ---------------------------------------------------------------------------
# Dev profile: run the API locally against docker compose databases.
# Redis is optional in dev; the in-memory cache keeps the developer loop fast.
# ---------------------------------------------------------------------------
%dev.app.cache.redis-enabled=false
%dev.quarkus.redis.devservices.enabled=false
%dev.quarkus.log.level=INFO
%dev.quarkus.log.category."com.aryafatthurahman.backend".level=DEBUG

# ---------------------------------------------------------------------------
# Test profile: H2 in PostgreSQL mode, no Docker, no Redis, no Flyway.
# Hibernate creates the schema; Flyway is validated separately against Postgres.
# ---------------------------------------------------------------------------
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:orders;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.redis.devservices.enabled=false
%test.quarkus.redis.hosts=redis://localhost:6379
%test.quarkus.redis.health.enabled=false
%test.app.cache.enabled=false
%test.app.cache.redis-enabled=false
%test.quarkus.log.category."com.aryafatthurahman.backend".level=INFO

# ---------------------------------------------------------------------------
# Prod profile: all connection details must come from the environment.
# ---------------------------------------------------------------------------
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.max-size=${DB_POOL_MAX_SIZE:20}
%prod.quarkus.redis.hosts=${REDIS_URL:redis://redis:6379}
%prod.quarkus.redis.password=${REDIS_PASSWORD:}
# Redis is an optimisation, not a readiness dependency: a cache outage must not
# remove healthy API pods from the Service endpoints.
%prod.quarkus.redis.health.enabled=false
%prod.app.cache.redis-enabled=true
%prod.quarkus.hibernate-orm.database.generation=validate
%prod.quarkus.flyway.migrate-at-start=true
