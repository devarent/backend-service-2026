apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: order-service
  labels:
    app.kubernetes.io/name: order-service
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - order-service
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  endpoints:
    - port: http
      path: /q/metrics
      interval: 30s
      scrapeTimeout: 10s
