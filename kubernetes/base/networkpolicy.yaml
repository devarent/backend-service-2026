# Port-scoped default deny. Ingress is limited to the API port so kubelet
# probes and the ingress controller can reach the pod; egress is limited to DNS,
# PostgreSQL, Redis, and HTTPS. Tighten the source selectors for your CNI and
# replace the database ports with a CIDR rule when using a managed database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-service
  labels:
    app.kubernetes.io/name: order-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: order-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    - ports:
        - protocol: TCP
          port: 443
