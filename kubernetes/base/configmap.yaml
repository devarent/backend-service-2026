apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  labels:
    app.kubernetes.io/name: order-service
data:
  QUARKUS_PROFILE: "prod"
  DB_URL: "jdbc:postgresql://postgres.order-service.svc.cluster.local:5432/orders"
  DB_USER: "orders"
  DB_POOL_MAX_SIZE: "20"
  REDIS_URL: "redis://redis.order-service.svc.cluster.local:6379"
  APP_CACHE_ENABLED: "true"
  APP_CACHE_REDIS_ENABLED: "true"
  APP_CACHE_TTL: "30s"
  APP_PRICING_TAX_RATE: "0.0825"
  APP_ORDERS_CURRENCY: "USD"
  APP_ORDERS_MAX_ITEMS_PER_ORDER: "100"
